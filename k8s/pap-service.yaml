apiVersion: apps/v1
kind: Deployment
metadata:
  name: pap-service
  namespace: security-pattern
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pap-service
  template:
    metadata:
      labels:
        app: pap-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: pap
          image: security-pattern-pap-service:latest
          ports:
            - containerPort: 8004
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: pap-service
  namespace: security-pattern
spec:
  selector:
    app: pap-service
  ports:
    - port: 8004
      targetPort: 8004
  type: ClusterIP