apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: security-pattern
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: auth
          image: security-pattern-auth-service:latest
          ports:
            - containerPort: 8002
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: security-pattern
spec:
  selector:
    app: auth-service
  ports:
    - port: 8002
      targetPort: 8002
      nodePort: 30082           
  type: NodePort