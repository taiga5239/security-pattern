apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: security-pattern
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: gateway
        static_configs: [{ targets: ["api-gateway:8000"] }]
      - job_name: pdp
        static_configs: [{ targets: ["pdp-service:8001"] }]
      - job_name: audit
        static_configs: [{ targets: ["audit-service:8005"] }]